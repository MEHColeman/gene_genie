AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'examples/**/*'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 110

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 25

Metrics/ClassLength:
  Max: 120

Metrics/ModuleLength:
  Exclude:
    - 'spec/**/*'

# Keyword arguments are self-documenting; only positional parameters are
# counted against the limit.
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'Guardfile'

# The specs predate frozen_string_literal comments; only the lib is enforced.
Style/FrozenStringLiteralComment:
  Exclude:
    - 'spec/**/*'
